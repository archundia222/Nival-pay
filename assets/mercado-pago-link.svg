<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Guía visual Mercado Pago para crear un link de pago</title>
<desc id="desc">Ilustración con tres pasos: abrir Cobrar, elegir Link de pago y copiar o compartir el enlace.</desc>
<rect width="900" height="560" rx="34" fill="#EFFAFF"/>
<rect x="42" y="42" width="816" height="476" rx="28" fill="#fff" stroke="#D7EDF6"/>
<text x="78" y="100" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#173B57">Mercado Pago</text>
<text x="78" y="132" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5B6B7B">Guía visual para crear y copiar tu link de pago</text>
<rect x="78" y="170" width="206" height="282" rx="28" fill="#009EE3"/>
<rect x="95" y="194" width="172" height="232" rx="20" fill="#F9FDFF"/>
<text x="181" y="233" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#173B57">1. Toca “Cobrar”</text>
<circle cx="181" cy="298" r="38" fill="#D9F3FF"/>
<text x="181" y="309" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#009EE3">$</text>
<rect x="123" y="365" width="116" height="36" rx="11" fill="#009EE3"/>
<text x="181" y="388" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Cobrar</text>
<path d="M310 311h64" stroke="#AAB7C4" stroke-width="4" stroke-linecap="round"/>
<path d="M364 302l12 9-12 9" fill="none" stroke="#AAB7C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="402" y="170" width="206" height="282" rx="28" fill="#fff" stroke="#D7EDF6" stroke-width="2"/>
<text x="505" y="227" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#173B57">2. Elige</text>
<text x="505" y="251" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#173B57">“Link de pago”</text>
<rect x="438" y="285" width="134" height="54" rx="15" fill="#EAF8FE"/>
<path d="M466 312c0-9 7-16 16-16h15v8h-15a8 8 0 000 16h15v8h-15c-9 0-16-7-16-16zm27-4h28v8h-28zm20-12h15c9 0 16 7 16 16s-7 16-16 16h-15v-8h15a8 8 0 000-16h-15z" fill="#009EE3"/>
<text x="505" y="379" text-anchor="middle" font-family="Arial" font-size="13" fill="#607080">Agrega monto y concepto</text>
<path d="M634 311h48" stroke="#AAB7C4" stroke-width="4" stroke-linecap="round"/>
<path d="M672 302l12 9-12 9" fill="none" stroke="#AAB7C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="710" y="170" width="110" height="282" rx="28" fill="#173B57"/>
<rect x="724" y="194" width="82" height="232" rx="18" fill="#fff"/>
<text x="765" y="236" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#173B57">3.</text>
<text x="765" y="260" text-anchor="middle" font-family="Arial" font-size="12" fill="#607080">Copia</text>
<text x="765" y="278" text-anchor="middle" font-family="Arial" font-size="12" fill="#607080">o comparte</text>
<rect x="738" y="315" width="54" height="38" rx="10" fill="#009EE3"/>
<path d="M755 334l9-7 9 7M764 327v18" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="765" y="387" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#607080">Link listo</text>
<text x="78" y="492" font-family="Arial" font-size="13" fill="#7B8794">Ilustración orientativa: la interfaz puede cambiar según la versión de la app.</text>
</svg>